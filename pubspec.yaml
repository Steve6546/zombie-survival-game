name: zombie_survival_game
description: A 2D top-down zombie survival game built with Flame engine.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.16.0
  flame_audio: ^2.1.8
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flame_test: ^1.16.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/